name: Build and publish documentation to GitHub Pages

on:
  push:
    branches: [ "main" ]

env:
  ASPNETCORE_ENVIRONMENT: Production
  WEBAPP_PATH: ./docs/MonorailCss.Docs/

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build solution
        run: dotnet build --configuration Release

      # Publish first, then export from the *published* app. `dotnet run` exports the plain
      # build output, whose Blazor WebAssembly payload (the /playground island) is untrimmed:
      # ~210 framework files / ~10.6 MB gzipped. Publishing runs the IL trimmer, which cuts
      # that to ~45 files / ~3.5 MB and makes the in-browser engine start faster.
      - name: Publish docs project
        run: dotnet publish ${{ env.WEBAPP_PATH }} --configuration Release --output ${{ runner.temp }}/docs-publish

      # Run from the project directory so Content/ resolves against the source tree, with the
      # web root pointed at the published (trimmed, fingerprinted) static assets.
      - name: Generate static files from the published app
        working-directory: ${{ env.WEBAPP_PATH }}
        env:
          ASPNETCORE_WEBROOT: ${{ runner.temp }}/docs-publish/wwwroot
        run: dotnet ${{ runner.temp }}/docs-publish/MonorailCss.Docs.dll build "/MonorailCss.Framework/"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Add .nojekyll file
        run: touch ${{ env.WEBAPP_PATH }}output/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.WEBAPP_PATH }}output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
